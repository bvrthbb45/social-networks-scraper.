# Production layout. Only the proxy is reachable from outside (HTTPS). The database is on an `internal`
# network with no route out; the API and the daily job never publish a port.
x-app: &app
  build: ./backend
  env_file: .env
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    networks: [data]

  migrate:
    <<: *app
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    networks: [data]

  api:
    <<: *app
    restart: unless-stopped
    # Trust X-Forwarded-For only from the proxy's network, so a client cannot pick its own address
    # (it drives rate limiting, lockouts and the audit log).
    environment:
      FORWARDED_ALLOW_IPS: 172.29.0.0/24
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - media:/data/media
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      data: {}
      edge: {}

  # Retention, consent expiry, orphan-media sweep and analysis, once a day (03:00 UTC).
  daily:
    <<: *app
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler", "3"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - media:/data/media
    read_only: true
    tmpfs: [/tmp]
    networks: [data]

  proxy:
    build:
      context: .
      dockerfile: deploy/proxy/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - ${CERT_DIR:?set CERT_DIR to the folder holding fullchain.pem and privkey.pem}:/certs:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [edge]

volumes:
  pgdata:
  media:

networks:
  data:
    internal: true   # no outbound connectivity
  edge:
    ipam:
      config:
        - subnet: 172.29.0.0/24
