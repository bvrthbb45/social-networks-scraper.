name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  data-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_no_data.py

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opsec
          POSTGRES_USER: opsec
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsec -d opsec"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_PG_URL: postgresql+psycopg://opsec:ci-password@localhost:5432/opsec
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: black --check .
      - run: pytest -q
      - run: pip-audit -r requirements.txt
