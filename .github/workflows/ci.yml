name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  data-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_no_data.py

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opsec
          POSTGRES_USER: opsec
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsec -d opsec"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_PG_URL: postgresql+psycopg://opsec:ci-password@localhost:5432/opsec
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OCR engine (Hebrew)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-heb
      - run: pip install -r requirements-dev.txt
      - run: black --check .
      - run: pytest -q
      - run: pip-audit -r requirements.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check

  e2e:
    # Real API + PostgreSQL + built web app + Chromium: the whole reviewer workflow.
    needs: [backend, web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opsec_e2e
          POSTGRES_USER: opsec
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsec -d opsec_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_PG_URL: postgresql+psycopg://opsec:ci-password@localhost:5432/opsec_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci && npm run build && npx playwright-core install --with-deps chromium
        working-directory: web
      - run: bash e2e/run.sh
        working-directory: web


  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses (the runner image already ships the SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle --no-daemon testDebugUnitTest assembleDebug lintDebug
        working-directory: android
      # Debug-signed build for testing on a device (sideload). Not for distribution: a release build needs the unit's own signing key.
      - uses: actions/upload-artifact@v4
        with:
          name: opsec-monitor-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: shellcheck scripts/*.sh
      - name: Generate secrets and a throw-away certificate
        run: |
          bash scripts/gen-secrets.sh
          mkdir certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -keyout certs/privkey.pem -out certs/fullchain.pem
          chmod 644 certs/*.pem
          echo "CERT_DIR=$PWD/certs" >> .env
          echo "HTTP_PORT=8080" >> .env
          echo "HTTPS_PORT=8443" >> .env
      - name: Start the whole stack
        run: docker compose --env-file .env up -d --build --wait --wait-timeout 300
      - name: Web app, API and security headers behind the proxy
        run: |
          curl -ksf https://localhost:8443/api/health
          curl -ksfI https://localhost:8443/ | grep -i "strict-transport-security"
          curl -ksfI https://localhost:8443/ | grep -i "content-security-policy"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 301
          test "$(curl -ks -o /dev/null -w '%{http_code}' https://localhost:8443/docs)" = 200  # SPA fallback, not the API docs
          test "$(curl -ks -o /dev/null -w '%{http_code}' https://localhost:8443/api/users)" = 401
      - name: First administrator can be created
        run: docker compose exec -T api python -m app.cli create-admin admin@example.org | tail -1 | grep -E '.{20,}'
      - name: Daily job runs
        run: docker compose run --rm --no-deps daily python -m app.cli daily
      - name: Backup is encrypted and verifiable
        run: |
          bash scripts/backup.sh backups
          ls backups
          ( cd backups && sha256sum -c SHA256-*.txt )
          ! grep -aq "PGDMP" backups/db-*.dump.enc
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -150
      - run: docker compose down -v
        if: always()
