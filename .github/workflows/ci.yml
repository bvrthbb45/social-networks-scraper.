name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  data-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_no_data.py

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opsec
          POSTGRES_USER: opsec
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsec -d opsec"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_PG_URL: postgresql+psycopg://opsec:ci-password@localhost:5432/opsec
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OCR engine (Hebrew)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-heb
      - run: pip install -r requirements-dev.txt
      - run: black --check .
      - run: pytest -q
      - run: pip-audit -r requirements.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check

  e2e:
    # Real API + PostgreSQL + built web app + Chromium: the whole reviewer workflow.
    needs: [backend, web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opsec_e2e
          POSTGRES_USER: opsec
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsec -d opsec_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_PG_URL: postgresql+psycopg://opsec:ci-password@localhost:5432/opsec_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci && npm run build && npx playwright-core install --with-deps chromium
        working-directory: web
      - run: bash e2e/run.sh
        working-directory: web


  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses (the runner image already ships the SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle --no-daemon testDebugUnitTest assembleDebug lintDebug
        working-directory: android
