# Reverse proxy. Terminates TLS with the unit's own certificate (mounted at /certs, never baked in),
# serves the web app, and forwards /api/* to the API with the prefix removed.
pid /tmp/nginx.pid;
worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;                       # request lines can carry ids; the application keeps its own audit log
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  client_max_body_size 25m;             # roster and evidence uploads; the API enforces its own limits
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

  server {
    listen 8080;
    return 301 https://$host$request_uri;
  }

  server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob:; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    location = /api/auth/login { limit_req zone=login burst=5 nodelay; include /etc/nginx/api_proxy.conf; }
    location /api/ { limit_req zone=api burst=40 nodelay; include /etc/nginx/api_proxy.conf; }

    location /assets/ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
      add_header Cache-Control "no-store";
    }
  }
}
